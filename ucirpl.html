<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCI Rocket Project Liquids</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0A1F44;
    color: #FFFFFF;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  h1 {
    margin: 0;
    padding: 24px 24px;
    font-size: 2rem;
    font-weight: 600;
    text-align: center;
  }
  h1 a {
    color: inherit;
    text-decoration: none;
  }
  h2 {
    margin: 0;
    padding: 24px 24px 8px;
    font-size: 1.75rem;
    font-weight: 600;
  }
  .hotfire {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: center;
    padding: 24px;
  }
  .hotfire h3 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
  }
  .hotfire .date {
    margin: 4px 0 0;
    font-size: 1.1rem;
    opacity: 0.8;
  }
  .hotfire .role {
    margin: 16px 0 0;
    font-size: 1.1rem;
  }
  .video {
    aspect-ratio: 16 / 9;
    background: #415A8A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }
  .video video {
    width: 100%;
    height: 100%;
    display: block;
  }
  .design {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 24px;
    padding: 24px;
  }
  .design .item {
    aspect-ratio: 1 / 1;
    background: #566B96;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }

  @media (max-width: 700px) {
    .hotfire { grid-template-columns: 1fr; }
    .design { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <h1><a href="./">Diego Kiyoshi Menendez</a></h1>

  <h2>3 Hotfires</h2>

  <section class="hotfire">
    <div>
      <h3>Hotfire 1</h3>
      <p class="date">[Date]</p>
      <p class="role">Testing role: [Role]</p>
    </div>
    <div class="video">[Video placeholder]</div>
  </section>

  <section class="hotfire">
    <div>
      <h3>Hotfire 2</h3>
      <p class="date">[Date]</p>
      <p class="role">Testing role: [Role]</p>
    </div>
    <div class="video">[Video placeholder]</div>
  </section>

  <section class="hotfire">
    <div>
      <h3>Hotfire 3</h3>
      <p class="date">[Date]</p>
      <p class="role">Testing role: [Role]</p>
    </div>
    <div class="video">[Video placeholder]</div>
  </section>

  <h2>Design Work</h2>

  <section class="design">
    <div class="item">[Design item 1]</div>
    <div class="item">[Design item 2]</div>
    <div class="item">[Design item 3]</div>
  </section>
</body>
</html>
