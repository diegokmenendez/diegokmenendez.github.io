<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diego Kiyoshi Menendez</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0A1F44;
    color: #FFFFFF;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  h1 {
    margin: 0;
    padding: 24px 24px;
    font-size: 2rem;
    font-weight: 600;
    text-align: center;
  }
  h1 a {
    color: inherit;
    text-decoration: none;
  }
  .links {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 0 24px 32px;
    font-size: 1.1rem;
  }
  .links a {
    color: #FFFFFF;
    text-decoration: underline;
  }
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .panel {
    position: relative;
    display: block;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    color: #FFFFFF;
    text-decoration: none;
    background-color: #0A1F44;
    background-size: cover;
    background-position: center;
    transition: opacity 0.2s;
  }
  .panel:hover { opacity: 0.8; }
  .panel span {
    position: absolute;
    left: 24px;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    font-size: 1.25rem;
    font-weight: 600;
  }
  /* Placeholder images. To use your own, replace each url(...) with a file path,
     for example: #rde { background-image: url("images/rde.jpg"); } */
  #rde {
    background-image: url("rde.jpg");
  }
  #ucirpl {
    background-image: url("ucirpl.jpg");
  }

  @media (max-width: 700px) {
    .panels { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <h1><a href="./">Diego Kiyoshi Menendez</a></h1>
  <nav class="links">
    <a href="#">LinkedIn</a>
    <a href="#">Resume (PDF)</a>
  </nav>
  <div class="panels">
    <a class="panel" id="rde" href="#"><span>X Energy Lab - 2in Rotating Detonation Engine</span></a>
    <a class="panel" id="ucirpl" href="ucirpl.html"><span>UCI Rocket Project Liquids - MOCH4</span></a>
  </div>
</body>
</html>
